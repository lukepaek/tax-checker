<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>세금·건강보험료 판정 확인서</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;600;700;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css">
<style>
  :root{
    --paper:#F6F2E7;
    --paper-2:#EFE9D8;
    --ink:#22262B;
    --ink-soft:#6B6558;
    --navy:#1B3A5C;
    --navy-soft:rgba(27,58,92,0.08);
    --line:#C9C2AC;
    --stamp:#A6392B;
    --stamp-soft:rgba(166,57,43,0.08);
    --positive:#2F6F4E;
    --positive-soft:rgba(47,111,78,0.10);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      repeating-linear-gradient(0deg, rgba(0,0,0,0.015) 0px, rgba(0,0,0,0.015) 1px, transparent 1px, transparent 34px),
      var(--paper);
    color:var(--ink);
    font-family:'Pretendard Variable','Pretendard',-apple-system,sans-serif;
    letter-spacing:-0.01em;
    padding:28px 16px 60px;
    min-height:100vh;
  }
  .mono{font-family:'JetBrains Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums;}
  .sheet{
    max-width:880px;margin:0 auto;
    background:var(--paper);
    border:1px solid var(--line);
    box-shadow:0 1px 2px rgba(34,38,43,0.05), 0 18px 40px -22px rgba(34,38,43,0.35);
    position:relative;
  }
  .sheet::before{
    content:"";position:absolute;inset:8px;
    border:1px solid var(--line);
    pointer-events:none;
  }
  .doc-head{
    padding:30px 34px 20px;
    border-bottom:2px solid var(--navy);
    display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;
  }
  .doc-title{
    font-family:'Noto Serif KR',serif;font-weight:800;font-size:1.5rem;color:var(--navy);
    letter-spacing:-0.01em;margin:0 0 6px;
  }
  .doc-sub{font-size:0.8rem;color:var(--ink-soft);margin:0;}
  .doc-no{font-family:'JetBrains Mono',monospace;font-size:0.72rem;color:var(--ink-soft);text-align:right;line-height:1.6;}
  .doc-no b{color:var(--navy);}

  .form-section{padding:26px 34px 8px;}
  .field-row{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px;}
  @media (max-width:640px){.field-row{grid-template-columns:1fr;}}
  label.field-label{
    display:block;font-size:0.72rem;font-weight:700;color:var(--navy);
    letter-spacing:0.03em;margin-bottom:6px;
  }
  input[type=text],input[type=number],select{
    width:100%;background:var(--paper-2);border:1px solid var(--line);
    border-radius:4px;padding:9px 11px;font-size:0.92rem;color:var(--ink);
    font-family:'JetBrains Mono','Pretendard Variable',monospace;
  }
  select{font-family:'Pretendard Variable',sans-serif;}
  input:focus,select:focus{outline:none;border-color:var(--navy);box-shadow:0 0 0 3px var(--navy-soft);}
  .hint{font-size:0.74rem;color:var(--ink-soft);margin-top:5px;line-height:1.5;}
  .detect-chip{
    display:inline-flex;align-items:center;gap:6px;margin-top:8px;
    background:var(--navy-soft);color:var(--navy);border-radius:20px;
    padding:5px 12px;font-size:0.78rem;font-weight:600;
  }
  .detect-chip.unknown{background:var(--stamp-soft);color:var(--stamp);}
  .override-row{margin-top:10px;}

  .amounts-toggle{
    background:none;border:1px dashed var(--line);border-radius:6px;
    color:var(--ink-soft);font-size:0.78rem;padding:7px 12px;cursor:pointer;
    margin:6px 0 18px;
  }
  .amounts-toggle:hover{border-color:var(--navy);color:var(--navy);}
  .amounts-box{display:none;}
  .amounts-box.open{display:grid;}

  .verdict-wrap{padding:6px 34px 10px;position:relative;}
  .verdict-head{
    display:flex;justify-content:space-between;align-items:center;
    margin:18px 0 14px;padding-top:18px;border-top:1px dashed var(--line);
  }
  .verdict-head h2{
    font-family:'Noto Serif KR',serif;font-size:1.05rem;color:var(--ink);margin:0;
  }
  .verdict-head span{font-size:0.72rem;color:var(--ink-soft);font-family:'JetBrains Mono',monospace;}

  table{width:100%;border-collapse:collapse;font-size:0.86rem;}
  th,td{border:1px solid var(--line);padding:10px 12px;text-align:left;vertical-align:top;}
  thead th{
    background:var(--navy);color:var(--paper);font-weight:700;font-size:0.78rem;
    letter-spacing:0.02em;
  }
  tbody th{
    background:var(--paper-2);font-weight:700;font-size:0.8rem;color:var(--navy);width:22%;
  }
  td .cell-main{font-weight:700;margin-bottom:3px;}
  td .cell-sub{color:var(--ink-soft);font-size:0.78rem;line-height:1.5;}
  td.isa-na{color:var(--ink-soft);font-style:italic;background:repeating-linear-gradient(45deg, transparent, transparent 8px, rgba(0,0,0,0.02) 8px, rgba(0,0,0,0.02) 16px);}
  .tag{display:inline-block;font-size:0.68rem;font-weight:700;padding:2px 7px;border-radius:3px;margin-bottom:4px;}
  .tag.pos{background:var(--positive-soft);color:var(--positive);}
  .tag.warn{background:var(--stamp-soft);color:var(--stamp);}
  .tag.neu{background:var(--navy-soft);color:var(--navy);}

  .stamp{
    position:absolute;right:38px;top:-6px;
    width:104px;height:104px;border:3px solid var(--stamp);border-radius:50%;
    color:var(--stamp);display:flex;align-items:center;justify-content:center;
    text-align:center;font-family:'Noto Serif KR',serif;font-weight:800;font-size:0.78rem;
    line-height:1.3;transform:rotate(-14deg);opacity:0.9;
    box-shadow:inset 0 0 0 3px rgba(166,57,43,0.15);
    pointer-events:none;
  }
  @media (max-width:640px){.stamp{position:static;transform:rotate(-6deg);margin:10px auto 0;}}

  .footnotes{
    padding:22px 34px 30px;border-top:2px solid var(--navy);margin-top:24px;
    font-size:0.74rem;color:var(--ink-soft);line-height:1.75;
  }
  .footnotes ol{margin:0;padding-left:18px;}
  .footnotes li{margin-bottom:6px;}
  .footnotes .flag{color:var(--stamp);font-weight:700;}

  .empty-state{padding:8px 34px 30px;color:var(--ink-soft);font-size:0.85rem;}

  .quote-wrap{padding:0 34px;}
  .quote-card{
    display:flex;flex-wrap:wrap;gap:22px;align-items:baseline;
    background:var(--paper-2);border:1px solid var(--line);border-radius:6px;
    padding:12px 16px;margin-top:4px;
  }
  .quote-item{display:flex;align-items:baseline;gap:8px;}
  .quote-label{font-size:0.7rem;font-weight:700;color:var(--navy);letter-spacing:0.02em;}
  .quote-val{font-family:'JetBrains Mono',monospace;font-size:0.92rem;font-weight:700;color:var(--ink);}
  .quote-change{font-family:'JetBrains Mono',monospace;font-size:0.76rem;color:var(--ink-soft);}
  .quote-note{width:100%;font-size:0.7rem;color:var(--ink-soft);margin-top:2px;}
  .quote-link{font-size:0.78rem;color:var(--navy);text-decoration:underline;text-underline-offset:2px;}
  .quote-link:hover{opacity:0.75;}
  .quote-card.quote-error{color:var(--stamp);font-size:0.8rem;background:var(--stamp-soft);border-color:var(--stamp);}

  .chart-wrap{padding:0 34px;margin-top:10px;}
  .chart-card{
    background:var(--paper-2);border:1px solid var(--line);border-radius:6px;
    padding:12px 16px 10px;
  }
  .chart-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:2px;}
  .chart-title{font-size:0.74rem;font-weight:700;color:var(--navy);letter-spacing:0.02em;}
  .chart-pct{font-family:'JetBrains Mono',monospace;font-size:0.9rem;font-weight:700;}
  .chart-pct.pos{color:var(--positive);}
  .chart-pct.neg{color:var(--stamp);}
  .chart-svg-wrap{width:100%;overflow:hidden;margin-top:2px;}
  .chart-foot{
    display:flex;justify-content:space-between;align-items:center;margin-top:4px;
    font-size:0.68rem;color:var(--ink-soft);font-family:'JetBrains Mono',monospace;
  }
  .chart-minmax{font-family:'Pretendard Variable',sans-serif;}
  .chart-loading{font-size:0.76rem;color:var(--ink-soft);padding:10px 2px;}
</style>
</head>
<body>

<div class="sheet">
  <div class="doc-head">
    <div>
      <p class="doc-title">세금·건강보험료 판정 확인서</p>
      <p class="doc-sub">종목코드 · 건강보험 자격 기준 참고용 계산 — 국세청/공단 공식 문서 아님</p>
    </div>
    <div class="doc-no">문서번호 <b id="docNo">TCK-000000</b><br>기준일자 2026-08-16</div>
  </div>

  <div class="form-section">
    <div class="field-row">
      <div>
        <label class="field-label">01. 종목코드 / 티커</label>
        <input type="text" id="tickerInput" placeholder="예: 458730 또는 SCHD" autocomplete="off">
        <div id="detectArea"></div>
      </div>
      <div>
        <label class="field-label">02. 건강보험 자격</label>
        <select id="insuranceSelect">
          <option value="local">지역가입자</option>
          <option value="worker">직장가입자</option>
          <option value="dependent">피부양자 (건물·토지 등 재산요건 별도)</option>
        </select>
        <div class="hint">피부양자는 이 계산기가 다루는 <b>소득요건</b>만 봅니다. 재산(부동산) 요건은 별도 심사이니 소득이 기준 이내여도 안심하지 마세요.</div>
      </div>
    </div>

    <button class="amounts-toggle" id="amountsToggleBtn" type="button">+ 연간 매매차익 · 분배금 금액 입력해서 실제 원화로 계산하기 (선택)</button>
    <div class="field-row amounts-box" id="amountsBox">
      <div>
        <label class="field-label">연간 매매차익(원)</label>
        <input type="number" id="capGainInput" placeholder="예: 100000000">
      </div>
      <div>
        <label class="field-label">연간 분배금 · 배당금(원)</label>
        <input type="number" id="distInput" placeholder="예: 30000000">
      </div>
    </div>
  </div>

  <div class="quote-wrap" id="quoteWrap"></div>

  <div class="chart-wrap" id="chartWrap"></div>

  <div class="verdict-wrap" id="verdictWrap"></div>

  <div class="footnotes">
    <ol id="footnoteList"></ol>
  </div>
</div>

<script>
// ------------------------------------------------------------------
// 국내 상장 종목코드 → 세제 카테고리 판정: 우리 Flask 서버의
// /api/classify-ticker/<code> 를 호출해서 실시간으로 받아온다.
// (서버가 네이버 금융 ETF 목록을 하루 1회 캐싱해서 응답 — 상세는 etf_classifier.py)
// ------------------------------------------------------------------
const API_BASE = ''; // 이 html이 Flask 서버와 같은 오리진에서 서빙된다는 가정. 다르면 예: 'https://your-flask-host.com'
const tickerCache = new Map(); // 같은 세션 안에서 같은 종목코드 재조회 방지

// 종목코드(예: 458730) → 국내 상장증권 ISIN(예: KR7458730009) 계산.
// KRX 상장증권은 NSIN이 "7" + 6자리코드 + "00" 형태이고, 마지막 체크디지트는
// 표준 ISIN 체크디지트 알고리즘(Luhn 변형)으로 계산됨. FunETF 상세페이지 링크에 사용.
function krIsinFromCode(code) {
  const isin11 = 'KR' + '7' + code + '00'; // 체크디지트 제외 11자리
  let digitStr = '';
  for (const ch of isin11) {
    digitStr += /[0-9]/.test(ch) ? ch : (ch.charCodeAt(0) - 55).toString(); // A=10 ... Z=35
  }
  let sum = 0;
  let doubleIt = true; // 오른쪽 끝 숫자부터 하나 걸러 두 배
  for (let i = digitStr.length - 1; i >= 0; i--) {
    let d = parseInt(digitStr[i], 10);
    if (doubleIt) {
      d *= 2;
      if (d > 9) d -= 9;
    }
    sum += d;
    doubleIt = !doubleIt;
  }
  const checkDigit = (10 - (sum % 10)) % 10;
  return isin11 + checkDigit;
}

function funetfProductUrl(code) {
  return `https://www.funetf.co.kr/product/etf/view/${krIsinFromCode(code)}`;
}

async function classifyKoreanTicker(code) {
  if (tickerCache.has(code)) return tickerCache.get(code);
  const res = await fetch(`${API_BASE}/api/classify-ticker/${code}`);
  if (!res.ok) {
    const body = await res.json().catch(() => ({}));
    throw new Error(body.error || `서버 응답 오류 (${res.status})`);
  }
  const data = await res.json();
  tickerCache.set(code, data);
  return data;
}

const quoteCache = new Map();
const QUOTE_CACHE_MS = 30_000; // 시세는 짧게만 캐시 (30초) — 너무 자주 바뀌니까

async function fetchKoreanQuote(code) {
  const cached = quoteCache.get(code);
  if (cached && Date.now() - cached.at < QUOTE_CACHE_MS) return cached.data;
  const res = await fetch(`${API_BASE}/api/quote/${code}`);
  if (!res.ok) {
    const body = await res.json().catch(() => ({}));
    throw new Error(body.error || `시세 서버 오류 (${res.status})`);
  }
  const data = await res.json();
  quoteCache.set(code, { at: Date.now(), data });
  return data;
}

// 배당주기는 네이버에 공개 API가 없어서, 종목명에 들어있는 표기로만 추정합니다.
// (정확한 지급주기가 필요하면 증권사 앱/HTS에서 다시 확인하세요)
function guessDividendCycle(name) {
  if (!name) return null;
  if (/월배당|먼슬리|monthly/i.test(name)) return '월배당 (종목명 기준 추정)';
  if (/분기배당|quarterly/i.test(name)) return '분기배당 (종목명 기준 추정)';
  if (/반기배당|semi.?annual/i.test(name)) return '반기배당 (종목명 기준 추정)';
  if (/연배당|연1회|annual/i.test(name)) return '연배당 (종목명 기준 추정)';
  return null;
}

function fmtWonAmount(raw) {
  if (raw === null || raw === undefined || raw === '') return '-';
  const n = Number(String(raw).replace(/,/g, ''));
  return Number.isFinite(n) ? n.toLocaleString('ko-KR') + '원' : String(raw);
}

function renderQuote(quoteWrap, name, quote, error) {
  if (error) {
    quoteWrap.innerHTML = `<div class="quote-card quote-error">시세/배당 정보 조회 실패: ${error.message} (판정 결과에는 영향 없음)</div>`;
    return;
  }
  if (!quote) {
    quoteWrap.innerHTML = '';
    return;
  }
  const rate = quote.changeRate !== null && quote.changeRate !== undefined ? Number(quote.changeRate) : null;
  const changeHtml = rate !== null && Number.isFinite(rate)
    ? `<span class="quote-change">${rate > 0 ? '+' : ''}${rate}%</span>` : '';
  const cycle = guessDividendCycle(name) || '종목명만으로는 확인 불가';
  const yieldSourceNote = quote.dividendYieldSource === 'manual' ? ' <span class="quote-change">(수동 입력값)</span>' : '';
  const funetfUrl = funetfProductUrl(quote.code);
  const yieldHtml = quote.dividendYieldRatio
    ? `<span class="quote-val">${quote.dividendYieldRatio}%</span>${yieldSourceNote}`
    : `<span class="quote-val">-</span> <a href="${funetfUrl}" target="_blank" rel="noopener" class="quote-link">분배금 상세보기 →</a>`;

  quoteWrap.innerHTML = `
    <div class="quote-card">
      <div class="quote-item"><span class="quote-label">현재가</span><span class="quote-val">${fmtWonAmount(quote.price)}</span>${changeHtml}</div>
      <div class="quote-item"><span class="quote-label">배당수익률</span>${yieldHtml}</div>
      <div class="quote-item"><span class="quote-label">배당주기</span><span class="quote-val" style="font-size:0.82rem;">${cycle}</span></div>
      <div class="quote-note">네이버 금융 시세 기준(최대 30초 지연) · 배당주기는 종목명 표기 기반 추정치이니 정확한 지급주기는 증권사 앱에서 재확인하세요</div>
    </div>`;
}

// ------------------------------------------------------------------
// 종목 자동인식 시 보여줄 주가 차트
// (국내 6자리는 서버가 네이버 fchart를, 해외 티커는 stooq.com CSV를 프록시해서 반환)
// ------------------------------------------------------------------
const chartCache = new Map();
const CHART_CACHE_MS = 10 * 60 * 1000; // 서버도 10분 캐시 — 클라이언트는 그보다 짧게

async function fetchChartData(code) {
  const cached = chartCache.get(code);
  if (cached && Date.now() - cached.at < CHART_CACHE_MS) return cached.data;
  const res = await fetch(`${API_BASE}/api/chart/${code}`);
  if (!res.ok) {
    const body = await res.json().catch(() => ({}));
    throw new Error(body.error || `차트 서버 오류 (${res.status})`);
  }
  const data = await res.json();
  chartCache.set(code, { at: Date.now(), data });
  return data;
}

function fmtChartPrice(n, market) {
  if (!Number.isFinite(n)) return '-';
  return market === 'kr' ? Math.round(n).toLocaleString('ko-KR') + '원' : '$' + n.toFixed(2);
}

function fmtChartDate(d) {
  const parts = String(d).split('-');
  return parts.length === 3 ? `${parts[1]}/${parts[2]}` : d;
}

// 일봉 캔들스틱 차트 + 오른쪽 가격축
function buildCandleChartSvg(points, market) {
  const W = 680, H = 224;
  const padL = 4, padR = 62, padT = 10, padB = 22;
  const innerW = W - padL - padR;
  const innerH = H - padT - padB;
  const n = points.length;

  const highs = points.map(p => (p.high ?? p.close));
  const lows = points.map(p => (p.low ?? p.close));
  let min = Math.min(...lows);
  let max = Math.max(...highs);
  if (min === max) { min -= 1; max += 1; }
  const margin = (max - min) * 0.06;
  min -= margin; max += margin;
  const span = (max - min) || 1;

  const xAt = (i) => padL + (n === 1 ? innerW / 2 : (innerW * i) / (n - 1));
  const yAt = (v) => padT + innerH - ((v - min) / span) * innerH;

  const spacing = n > 1 ? innerW / (n - 1) : innerW;
  const bodyW = Math.max(1, Math.min(6, spacing * 0.64));
  const axisFont = `font-family="'JetBrains Mono',monospace" font-size="9.5" fill="var(--ink-soft)"`;

  // 오른쪽 가격축 (가로 점선 + 가격 라벨)
  let gridSvg = '';
  const priceTicks = 4;
  for (let i = 0; i <= priceTicks; i++) {
    const v = min + (span * i) / priceTicks;
    const y = yAt(v);
    gridSvg += `<line x1="${padL}" y1="${y.toFixed(1)}" x2="${(W - padR).toFixed(1)}" y2="${y.toFixed(1)}" stroke="var(--line)" stroke-width="0.5" stroke-dasharray="2 3"/>`;
    gridSvg += `<text ${axisFont} x="${(W - padR + 6).toFixed(1)}" y="${y.toFixed(1)}" dominant-baseline="middle">${fmtChartPrice(v, market)}</text>`;
  }

  // 아래 날짜축 (5개 지점만 표시)
  let dateSvg = '';
  const idxSet = new Set([0, Math.round((n - 1) * 0.25), Math.round((n - 1) * 0.5), Math.round((n - 1) * 0.75), n - 1]);
  idxSet.forEach((i) => {
    const x = xAt(i);
    const anchor = i === 0 ? 'start' : (i === n - 1 ? 'end' : 'middle');
    dateSvg += `<text ${axisFont} x="${x.toFixed(1)}" y="${H - 6}" text-anchor="${anchor}">${fmtChartDate(points[i].date)}</text>`;
  });

  // 캔들(고가-저가 심지 + 시가-종가 몸통)
  let candleSvg = '';
  points.forEach((p, i) => {
    const x = xAt(i);
    const o = p.open ?? p.close, h = p.high ?? p.close, l = p.low ?? p.close, c = p.close;
    const color = c >= o ? 'var(--positive)' : 'var(--stamp)';
    const yHigh = yAt(h), yLow = yAt(l);
    const yOpen = yAt(o), yClose = yAt(c);
    const bodyTop = Math.min(yOpen, yClose);
    const bodyH = Math.max(1, Math.abs(yClose - yOpen));
    candleSvg += `<line x1="${x.toFixed(1)}" y1="${yHigh.toFixed(1)}" x2="${x.toFixed(1)}" y2="${yLow.toFixed(1)}" stroke="${color}" stroke-width="1"/>`;
    candleSvg += `<rect x="${(x - bodyW / 2).toFixed(1)}" y="${bodyTop.toFixed(1)}" width="${bodyW.toFixed(1)}" height="${bodyH.toFixed(1)}" fill="${color}"/>`;
  });

  return `
    <svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" preserveAspectRatio="none" style="display:block;">
      ${gridSvg}
      ${candleSvg}
      ${dateSvg}
    </svg>`;
}

function renderChartLoading(chartWrap) {
  chartWrap.innerHTML = `<div class="chart-loading">📈 차트 불러오는 중…</div>`;
}

function renderChart(chartWrap, market, points, error) {
  if (error) {
    chartWrap.innerHTML = `<div class="quote-card quote-error">차트 조회 실패: ${error.message} (판정 결과에는 영향 없음)</div>`;
    return;
  }
  if (!points || points.length < 2) {
    chartWrap.innerHTML = '';
    return;
  }
  const closes = points.map(p => p.close);
  const first = closes[0];
  const last = closes[closes.length - 1];
  const pct = first ? ((last - first) / first) * 100 : 0;
  const up = pct >= 0;

  chartWrap.innerHTML = `
    <div class="chart-card">
      <div class="chart-head">
        <span class="chart-title">최근 ${points.length}거래일 (일봉)</span>
        <span class="chart-pct ${up ? 'pos' : 'neg'}">${up ? '+' : ''}${pct.toFixed(1)}%</span>
      </div>
      <div class="chart-svg-wrap">${buildCandleChartSvg(points, market)}</div>
    </div>`;
}

const CATEGORY_INFO = {
  domestic: {
    label: "국내 개별주식 / 국내주식형 ETF",
    isaEligible: true,
    capGainType: "exempt",
  },
  overseas_etf: {
    label: "국내상장 해외지수·채권·파생형 ETF",
    isaEligible: true,
    capGainType: "divTax",
  },
  us_direct: {
    label: "미국 직접 상장 (해외주식 직접투자)",
    isaEligible: false,
    capGainType: "capGains",
  },
};

const WON = (n) => n.toLocaleString('ko-KR') + '원';
const FIN_DEMINIMIS = 10_000_000;      // 이자+배당 1천만원 이하는 건보료 산정에서 제외
const COMP_TAX_LIMIT = 20_000_000;     // 금융소득종합과세 / 피부양자 소득요건 2천만원
const WORKER_DEDUCT_NOW = 20_000_000;  // 직장가입자 소득월액 공제(현재)
const WORKER_DEDUCT_PROPOSED = 10_000_000; // 2026.07 개편 검토안(미확정)
const ISA_TAXFREE_GENERAL = 2_000_000;
const ISA_RATE = 0.099;
const DIV_TAX_RATE = 0.154;
const CAPGAIN_RATE = 0.22;
const CAPGAIN_DEDUCT = 2_500_000;

function detectTicker(raw) {
  const v = (raw || '').trim();
  if (!v) return null;
  if (/^\d{6}$/.test(v)) {
    // 국내 6자리 코드는 형태만 확인 — 실제 분류는 classifyKoreanTicker()가 서버에 물어봄
    return { code: v, category: null, name: null, known: false, isKorean: true };
  }
  if (/^[A-Za-z.]{1,6}$/.test(v)) {
    return { code: v.toUpperCase(), category: 'us_direct', name: v.toUpperCase() + ' (미국 직접 상장)', known: true, isKorean: false };
  }
  return { code: v, category: null, name: null, known: false, isKorean: null };
}

function fmtCellAmount(label, amount) {
  if (amount === null) return `<div class="cell-main">${label}</div>`;
  return `<div class="cell-main">${label}</div><div class="cell-sub mono">${WON(Math.round(amount))}</div>`;
}

function computeVerdict(category, insurance, capGain, dist) {
  const info = CATEGORY_INFO[category];
  const hasAmounts = capGain !== null || dist !== null;
  const cg = capGain || 0;
  const ds = dist || 0;

  // ---------------- 일반계좌 ----------------
  let normalCapTax, normalCapNote;
  if (info.capGainType === 'exempt') {
    normalCapTax = { label: '비과세', sub: '증권거래세만 부담 (매매차익 자체엔 과세 없음)', amount: hasAmounts ? 0 : null };
  } else if (info.capGainType === 'divTax') {
    normalCapTax = { label: `배당소득세 ${(DIV_TAX_RATE*100).toFixed(1)}%`, sub: '보유기간과세 — 실제 매매차익과 과표기준가 증분 중 작은 금액 기준', amount: hasAmounts ? cg * DIV_TAX_RATE : null };
  } else {
    const taxable = Math.max(0, cg - CAPGAIN_DEDUCT);
    normalCapTax = { label: `양도소득세 ${(CAPGAIN_RATE*100).toFixed(0)}%`, sub: `분류과세(종합소득 아님) · 기본공제 ${WON(CAPGAIN_DEDUCT)} 차감 후 세율 적용, 매년 5월 별도 신고`, amount: hasAmounts ? taxable * CAPGAIN_RATE : null };
  }
  const normalDistTax = { label: `배당소득세 ${(DIV_TAX_RATE*100).toFixed(1)}%`, sub: category === 'us_direct' ? '미국 원천 15% + 국내 조정분 0.4%p (외국납부세액공제)' : '원천징수로 일단 종결', amount: hasAmounts ? ds * DIV_TAX_RATE : null };

  // 건보료/신고 대상 소득 = 분배금 + (해외직접이 아니면 매매차익도 포함, 해외직접의 매매차익은 양도소득이라 별도 취급)
  const finIncome = ds + (category === 'us_direct' ? 0 : cg);
  const overThreshold = hasAmounts ? finIncome > COMP_TAX_LIMIT : null;

  let insReport;
  if (insurance === 'local') {
    const included = hasAmounts ? (finIncome > FIN_DEMINIMIS ? finIncome : 0) : null;
    insReport = {
      label: hasAmounts ? (included > 0 ? '건보료 산정에 포함됨' : '건보료 산정 제외') : '금액 입력 시 판정',
      sub: `지역가입자는 별도 면제구간이 없어 이자+배당 합계가 ${WON(FIN_DEMINIMIS)} 초과 시 전액이 매년 보험료 재산정에 반영됩니다 (이하면 아예 제외).`,
      tag: hasAmounts ? (included > 0 ? 'warn' : 'pos') : 'neu',
    };
  } else if (insurance === 'worker') {
    insReport = {
      label: hasAmounts
        ? (finIncome > FIN_DEMINIMIS && finIncome > WORKER_DEDUCT_NOW ? '소득월액보험료 추가 부과 대상' : '현재 기준으론 영향 없음')
        : '금액 입력 시 판정',
      sub: `이자+배당 ${WON(FIN_DEMINIMIS)} 이하는 계산에서 제외. 보수외소득이 연 ${WON(WORKER_DEDUCT_NOW)} 초과 시 추가 부과 (현재 기준). <span class="flag">⚠ 2026년 7월 이 공제기준을 ${WON(WORKER_DEDUCT_PROPOSED)}로 낮추는 개편이 검토 중 — 아직 미확정.</span>`,
      tag: hasAmounts ? (finIncome > WORKER_DEDUCT_NOW ? 'warn' : 'pos') : 'neu',
    };
  } else {
    insReport = {
      label: hasAmounts ? (overThreshold ? '피부양자 자격 상실 가능성' : '소득요건상 자격 유지') : '금액 입력 시 판정',
      sub: `연간 관련 소득 합계가 ${WON(COMP_TAX_LIMIT)} 초과하면 피부양자 자격을 잃고 지역가입자로 전환됩니다. 재산(건물·토지 등) 요건은 별도 심사이니 함께 확인하세요.`,
      tag: hasAmounts ? (overThreshold ? 'warn' : 'pos') : 'neu',
    };
  }

  let reportTarget;
  if (category === 'us_direct') {
    reportTarget = {
      label: hasAmounts && cg > CAPGAIN_DEDUCT ? '양도소득세 신고 대상' : '매매차익 신고는 이익 있으면 원칙상 필요',
      sub: `매매차익은 매년 5월 양도소득세로 별도 신고(증권사 대행 가능, 금융소득종합과세와 무관). 배당은 ${WON(COMP_TAX_LIMIT)} 초과 시(다른 이자·배당 합산) 금융소득종합과세로 별도 신고.`,
      tag: 'neu',
    };
  } else {
    reportTarget = {
      label: hasAmounts ? (overThreshold ? '금융소득종합과세 신고 대상' : '신고 불필요 (원천징수 종결)') : '금액 입력 시 판정',
      sub: `연간 금융소득(이자+배당, 매매차익 포함) 합계가 ${WON(COMP_TAX_LIMIT)} 초과 시 다른 종합소득과 합산되어 누진세율로 재계산됩니다.`,
      tag: hasAmounts ? (overThreshold ? 'warn' : 'pos') : 'neu',
    };
  }

  // ---------------- ISA 계좌 ----------------
  let isaCapTax, isaDistTax, isaIns, isaReport;
  if (!info.isaEligible) {
    isaCapTax = isaDistTax = isaIns = isaReport = null; // N/A
  } else {
    const netProfit = cg + ds;
    const taxableIsa = hasAmounts ? Math.max(0, netProfit - ISA_TAXFREE_GENERAL) : null;
    const isaTax = hasAmounts ? taxableIsa * ISA_RATE : null;
    isaCapTax = { label: hasAmounts ? '계좌 내 손익 통산' : `${WON(ISA_TAXFREE_GENERAL)}(일반형)까지 비과세`, sub: '매매차익·분배금을 합산해 아래 한 줄로 과세', amount: null, mergedNote: true };
    isaDistTax = { label: hasAmounts ? `초과분 ${(ISA_RATE*100).toFixed(1)}% 분리과세` : `${WON(ISA_TAXFREE_GENERAL)} 초과분만 ${(ISA_RATE*100).toFixed(1)}%`, sub: `서민·농어민형은 비과세 한도 ${WON(4_000_000)}. 초과분은 9.9% 분리과세로 완전히 종결.`, amount: isaTax };
    isaIns = { label: '건보료 산정 제외', sub: '비과세·분리과세 처리되어 금액과 무관하게 건강보험료 산정 소득에 포함되지 않습니다.', tag: 'pos' };
    isaReport = { label: '신고 대상 아님', sub: '금액과 무관하게 금융소득종합과세 대상에서 제외됩니다.', tag: 'pos' };
  }

  return { normalCapTax, normalDistTax, insReport, reportTarget, isaCapTax, isaDistTax, isaIns, isaReport, isaEligible: info.isaEligible, netProfit: cg + ds, hasAmounts };
}

// 빠른 타이핑 중 여러 요청이 겹쳐도, 마지막 입력에 대한 응답만 반영하기 위한 토큰
let renderToken = 0;
let debounceTimer = null;

function scheduleRender() {
  clearTimeout(debounceTimer);
  debounceTimer = setTimeout(renderAsync, 350);
}

async function renderAsync() {
  const myToken = ++renderToken;
  const raw = document.getElementById('tickerInput').value;
  const shape = detectTicker(raw);
  const detectArea = document.getElementById('detectArea');
  const quoteWrap = document.getElementById('quoteWrap');
  const chartWrap = document.getElementById('chartWrap');
  const verdictWrap = document.getElementById('verdictWrap');
  const footnoteList = document.getElementById('footnoteList');
  document.getElementById('docNo').textContent = 'TCK-' + (raw ? raw.toUpperCase().replace(/[^A-Z0-9]/g,'').padEnd(6,'0').slice(0,6) : '000000');

  if (!shape) {
    detectArea.innerHTML = '';
    quoteWrap.innerHTML = '';
    chartWrap.innerHTML = '';
    verdictWrap.innerHTML = '<div class="empty-state">종목코드나 티커를 입력하면 판정 결과가 여기에 표시됩니다. (예: 458730, SCHD, TQQQ, 005930)</div>';
    footnoteList.innerHTML = '';
    return;
  }

  if (!shape.isKorean) {
    // 미국 티커는 분류 자체는 서버 조회 없이 바로 판정하지만,
    // 차트는 stooq.com을 프록시하는 서버 엔드포인트에서 받아온다.
    quoteWrap.innerHTML = '';
    renderChartLoading(chartWrap);
    renderDetected(shape, detectArea, verdictWrap, footnoteList);
    fetchChartData(shape.code)
      .then((data) => {
        if (myToken !== renderToken) return;
        renderChart(chartWrap, data.market, data.points, null);
      })
      .catch((err) => {
        if (myToken !== renderToken) return;
        renderChart(chartWrap, 'us', null, err);
      });
    return;
  }

  // 국내 6자리 코드 → 서버에 "분류" · "시세/배당" · "차트" 동시 조회
  detectArea.innerHTML = `<div class="detect-chip">🔎 종목 정보 조회 중…</div>`;
  quoteWrap.innerHTML = '';
  renderChartLoading(chartWrap);
  const [classifyResult, quoteResult, chartResult] = await Promise.allSettled([
    classifyKoreanTicker(shape.code),
    fetchKoreanQuote(shape.code),
    fetchChartData(shape.code),
  ]);
  if (myToken !== renderToken) return; // 그 사이 입력이 바뀜 → 이 응답은 버림

  if (classifyResult.status === 'rejected') {
    detectArea.innerHTML = `<div class="detect-chip unknown">⚠ 서버 조회 실패 (${classifyResult.reason.message}) — 아래에서 유형을 직접 선택해주세요</div>`;
    chartWrap.innerHTML = '';
    renderManualOverride(shape, detectArea, verdictWrap, footnoteList);
    return;
  }

  const info = classifyResult.value;
  const detected = {
    code: shape.code,
    category: info.category,
    name: info.name || `${shape.code} (개별종목으로 간주)`,
    isKorean: true,
    isEtf: info.isEtf,
  };

  if (quoteResult.status === 'fulfilled') {
    renderQuote(quoteWrap, detected.name, quoteResult.value, null);
  } else {
    renderQuote(quoteWrap, detected.name, null, quoteResult.reason);
  }

  if (chartResult.status === 'fulfilled') {
    renderChart(chartWrap, chartResult.value.market, chartResult.value.points, null);
  } else {
    renderChart(chartWrap, 'kr', null, chartResult.reason);
  }

  renderDetected(detected, detectArea, verdictWrap, footnoteList);
}

function renderDetected(detected, detectArea, verdictWrap, footnoteList) {
  const category = detected.category;
  if (detected.isKorean) {
    const sourceNote = detected.isEtf ? 'ETF 목록 매칭' : 'ETF 목록에 없어 개별종목으로 간주';
    detectArea.innerHTML = `<div class="detect-chip">🇰🇷 자동인식: <b>${detected.name}</b> — ${CATEGORY_INFO[category].label}<div class="hint">(${sourceNote})</div></div>`;
  } else {
    detectArea.innerHTML = `<div class="detect-chip">🇺🇸 자동인식: <b>${detected.name}</b> — ${CATEGORY_INFO[category].label}</div>`;
  }
  renderVerdict(category, verdictWrap, footnoteList);
}

function renderManualOverride(shape, detectArea, verdictWrap, footnoteList) {
  const overrideHtml = `
    <div class="override-row">
      <select id="manualCat">
        <option value="">-- 유형 선택 --</option>
        <option value="domestic">국내 개별주식 / 국내주식형 ETF (매매차익 비과세)</option>
        <option value="overseas_etf">국내상장 해외지수·채권·파생형 ETF (매매차익도 배당소득세)</option>
      </select>
    </div>`;
  detectArea.innerHTML += overrideHtml;
  const savedManual = detectArea.dataset.manual;
  const sel = document.getElementById('manualCat');
  if (savedManual) sel.value = savedManual;
  sel.addEventListener('change', () => { detectArea.dataset.manual = sel.value; renderAsync(); });
  const category = savedManual || null;
  if (!category) {
    verdictWrap.innerHTML = '<div class="empty-state">유형을 선택하면 판정 결과가 표시됩니다.</div>';
    footnoteList.innerHTML = '';
    return;
  }
  renderVerdict(category, verdictWrap, footnoteList);
}

function renderVerdict(category, verdictWrap, footnoteList) {
  const insurance = document.getElementById('insuranceSelect').value;
  const capGainRaw = document.getElementById('capGainInput').value;
  const distRaw = document.getElementById('distInput').value;
  const capGain = capGainRaw === '' ? null : Math.max(0, parseFloat(capGainRaw) || 0);
  const dist = distRaw === '' ? null : Math.max(0, parseFloat(distRaw) || 0);

  const v = computeVerdict(category, insurance, capGain, dist);

  const stampText = !v.isaEligible ? 'ISA<br>가입불가' : (v.hasAmounts && v.netProfit > ISA_TAXFREE_GENERAL ? '분리과세<br>9.9%' : '참고용<br>확인서');

  const isaCell = (cell, na) => {
    if (na) return `<td class="isa-na">해당 종목은 국내 상장이 아니라<br>ISA에 직접 편입할 수 없습니다</td>`;
    return `<td>${fmtCellAmount(cell.label, cell.amount)}<div class="cell-sub">${cell.sub}</div></td>`;
  };
  const tagCell = (cell, na) => {
    if (na) return `<td class="isa-na">—</td>`;
    return `<td><span class="tag ${cell.tag}">${cell.label}</span><div class="cell-sub">${cell.sub}</div></td>`;
  };

  verdictWrap.innerHTML = `
    <div class="stamp">${stampText}</div>
    <div class="verdict-head"><h2>판정 결과</h2><span>${insurance === 'local' ? '지역가입자' : insurance === 'worker' ? '직장가입자' : '피부양자'} 기준</span></div>
    <table>
      <thead><tr><th></th><th>일반계좌</th><th>ISA 계좌</th></tr></thead>
      <tbody>
        <tr><th>매매차익 세금</th><td>${fmtCellAmount(v.normalCapTax.label, v.normalCapTax.amount)}<div class="cell-sub">${v.normalCapTax.sub}</div></td>${isaCell(v.isaCapTax, !v.isaEligible)}</tr>
        <tr><th>분배금 세금</th><td>${fmtCellAmount(v.normalDistTax.label, v.normalDistTax.amount)}<div class="cell-sub">${v.normalDistTax.sub}</div></td>${isaCell(v.isaDistTax, !v.isaEligible)}</tr>
        <tr><th>건강보험료 산정</th>${tagCell(v.insReport, false)}${tagCell(v.isaIns, !v.isaEligible)}</tr>
        <tr><th>종합소득신고</th>${tagCell(v.reportTarget, false)}${tagCell(v.isaReport, !v.isaEligible)}</tr>
      </tbody>
    </table>
  `;

  footnoteList.innerHTML = `
    <li>이 확인서는 2026년 8월 기준 일반적인 세법/건강보험료 규정을 정리한 <b>참고용</b> 계산기이며, 국세청·국민건강보험공단이 발급한 문서가 아닙니다. 개인별 다른 소득·공제 상황에 따라 실제 결과는 달라질 수 있습니다.</li>
